name: Prod Health Check

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
    # 5:00 PM IST = 11:30 AM UTC
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  run-prod-health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install Playwright Chromium
        run: |
          mvn dependency:resolve --no-transfer-progress
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright/playwright -name "playwright-*.jar" | head -1)
          DRIVER_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver -name "driver-*.jar" | head -1)
          BUNDLE_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver-bundle -name "driver-bundle-*.jar" | head -1)
          java -cp "$PLAYWRIGHT_JAR:$DRIVER_JAR:$BUNDLE_JAR" com.microsoft.playwright.CLI install chromium

      - name: Run Prod Health Check
        id: run_test
        run: xvfb-run mvn test -Dtest=ProdHealthCheckTest
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Upload Dashboard Report (GitHub Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prod-Health-Check-Dashboard
          path: target/AutomationDashboard.html

      - name: Upload Playwright Trace (GitHub Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prod-Health-Check-Trace
          path: target/prod-health-check-trace.zip

      # ── Save report + trace to Supabase ──────────────────────────
      - name: Save to Supabase Dashboard
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Determine status from job result
          if [ "${{ steps.run_test.outcome }}" == "success" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          TIMESTAMP=$(date +%s)
          REPORT_URL="null"
          TRACE_URL="null"
          TRACES_JSON="[]"

          # Upload HTML report to Supabase Storage
          REPORT_FILE="target/AutomationDashboard.html"
          if [ -f "$REPORT_FILE" ]; then
            REPORT_NAME="EMB_RA_ProdHealthCheck_${TIMESTAMP}.html"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: text/html" \
              -H "x-upsert: true" \
              --data-binary @"${REPORT_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${REPORT_NAME}")
            echo "Report upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              REPORT_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${REPORT_NAME}"
              echo "Report URL: $REPORT_URL"
            fi
          fi

          # Upload trace zip to Supabase Storage
          TRACE_FILE="target/prod-health-check-trace.zip"
          if [ -f "$TRACE_FILE" ]; then
            TRACE_NAME="EMB_RA_ProdHealthCheck_trace_${TIMESTAMP}.zip"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/zip" \
              -H "x-upsert: true" \
              --data-binary @"${TRACE_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${TRACE_NAME}")
            echo "Trace upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              TRACE_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${TRACE_NAME}"
              TRACES_JSON="[{\"name\":\"prod-health-check-trace.zip\",\"url\":\"${TRACE_URL}\"}]"
              echo "Trace URL: $TRACE_URL"
            fi
          fi

          # Insert row into test_reports table
          curl -s -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"project\": \"EMB_RA\",
              \"environment\": \"PROD\",
              \"status\": \"${STATUS}\",
              \"passed\": 0,
              \"failed\": 0,
              \"total\": 0,
              \"duration_seconds\": 0,
              \"report_url\": $([ "$REPORT_URL" = "null" ] && echo "null" || echo "\"${REPORT_URL}\""),
              \"trace_url\": $([ "$TRACE_URL" = "null" ] && echo "null" || echo "\"${TRACE_URL}\""),
              \"traces\": ${TRACES_JSON}
            }" \
            "${SUPABASE_URL}/rest/v1/test_reports"

          echo "✅ Saved to Supabase dashboard (status: ${STATUS})"