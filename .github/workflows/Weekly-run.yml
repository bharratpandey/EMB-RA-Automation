name: Weekly EMB-RA Automation Report

on:
  schedule:
    # Every Monday 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright Browsers & Dependencies
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run E2E Tests
        run: xvfb-run mvn test -Dtest=CreateRequirementTest
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Upload Dashboard Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Dashboard
          path: target/AutomationDashboard.html