name: Daily E2E — ScheduleInterviewAssignmentAssessmentTest

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install Playwright Chromium
        run: |
          mvn dependency:resolve --no-transfer-progress
          PLAYWRIGHT_JAR=$(find ~/.m2/repository/com/microsoft/playwright/playwright -name "playwright-*.jar" | head -1)
          DRIVER_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver -name "driver-*.jar" | head -1)
          BUNDLE_JAR=$(find ~/.m2/repository/com/microsoft/playwright/driver-bundle -name "driver-bundle-*.jar" | head -1)
          echo "Playwright: $PLAYWRIGHT_JAR"
          echo "Driver: $DRIVER_JAR"
          echo "Bundle: $BUNDLE_JAR"
          java -cp "$PLAYWRIGHT_JAR:$DRIVER_JAR:$BUNDLE_JAR" com.microsoft.playwright.CLI install chromium

      - name: Run Test
        id: run_test
        run: xvfb-run mvn test -Dtest="ScheduleInterviewAssignmentAssessmentTest#testMasterE2EFlow" --no-transfer-progress

      - name: Upload Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ github.run_number }}
          path: target/*.zip
          retention-days: 7

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: target/*.html
          retention-days: 7

      # ── Save report + trace to Supabase ──────────────────────────
      - name: Save to Supabase Dashboard
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ steps.run_test.outcome }}" == "success" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          TIMESTAMP=$(date +%s)
          REPORT_URL="null"
          TRACES_JSON="[]"

          # Upload HTML report
          REPORT_FILE="target/AutomationDashboard.html"
          if [ -f "$REPORT_FILE" ]; then
            REPORT_NAME="EMB_RA_DailyE2E_${TIMESTAMP}.html"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: text/html" \
              -H "x-upsert: true" \
              --data-binary @"${REPORT_FILE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${REPORT_NAME}")
            echo "Report upload HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              REPORT_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${REPORT_NAME}"
              echo "Report URL: $REPORT_URL"
            fi
          fi

          # Upload full E2E trace
          FULL_TRACE="target/e2e-daily-full-trace.zip"
          if [ -f "$FULL_TRACE" ]; then
            TRACE_NAME="EMB_RA_DailyE2E_trace_${TIMESTAMP}.zip"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/zip" \
              -H "x-upsert: true" \
              --data-binary @"${FULL_TRACE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${TRACE_NAME}")
            echo "Full trace HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              TRACE_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${TRACE_NAME}"
              TRACES_JSON="[{\"name\":\"e2e-daily-full-trace.zip\",\"url\":\"${TRACE_URL}\"}]"
              echo "Trace URL: $TRACE_URL"
            fi
          fi

          # Upload crash trace if it exists (failure only)
          CRASH_TRACE="target/e2e-crash-trace.zip"
          if [ -f "$CRASH_TRACE" ]; then
            CRASH_NAME="EMB_RA_DailyE2E_crash_trace_${TIMESTAMP}.zip"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/zip" \
              -H "x-upsert: true" \
              --data-binary @"${CRASH_TRACE}" \
              "${SUPABASE_URL}/storage/v1/object/reports/${CRASH_NAME}")
            echo "Crash trace HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              CRASH_URL="${SUPABASE_URL}/storage/v1/object/public/reports/${CRASH_NAME}"
              TRACES_JSON=$(echo "$TRACES_JSON" | sed "s/\]$/,{\"name\":\"e2e-crash-trace.zip\",\"url\":\"${CRASH_URL}\"}]/")
              echo "Crash URL: $CRASH_URL"
            fi
          fi

          # Insert row into test_reports
          curl -s -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"project\": \"EMB_RA\",
              \"report_name\": \"RA Daily E2E Flow\",
              \"environment\": \"UAT\",
              \"status\": \"${STATUS}\",
              \"passed\": 0,
              \"failed\": 0,
              \"total\": 0,
              \"duration_seconds\": 0,
              \"report_url\": $([ "$REPORT_URL" = "null" ] && echo "null" || echo "\"${REPORT_URL}\""),
              \"trace_url\": null,
              \"traces\": ${TRACES_JSON}
            }" \
            "${SUPABASE_URL}/rest/v1/test_reports"

          echo "✅ Saved to Supabase dashboard (status: ${STATUS})"