name: Daily E2E — ScheduleInterviewAssignmentAssessmentTest

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST = 3:30 AM UTC
  workflow_dispatch:         # Manual trigger from GitHub UI anytime

jobs:
  run-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven          # ← caches Maven dependencies — fast after first run

      - name: Install Playwright Chromium
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium --with-deps"

      - name: Run Test
        run: mvn test -Dtest=ScheduleInterviewAssignmentAssessmentTest --no-transfer-progress

      - name: Upload Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ github.run_number }}
          path: target/*.zip
          retention-days: 7

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: target/*.html
          retention-days: 7